<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="12" y1="46" x2="52" y2="46" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Candlestick / Bar Columns -->
  <!-- Bar 1 -->
  <rect x="14" y="36" width="7" height="14" rx="2" fill="url(#chartGrad)" opacity="0.75"/>
  <!-- Bar 2 -->
  <rect x="25" y="26" width="7" height="24" rx="2" fill="url(#chartGrad)" opacity="0.85"/>
  <!-- Bar 3 -->
  <rect x="36" y="18" width="7" height="32" rx="2" fill="url(#chartGrad)"/>

  <!-- Dynamic Upward Bull Momentum Curve -->
  <path d="M 12 42 Q 26 34 37 22 T 48 14" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Arrow Peak -->
  <polygon points="44,11 52,11 52,19" fill="#34d399"/>

  <!-- Pulse / Crest Node -->
  <circle cx="48" cy="14" r="3.5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="48" cy="14" r="1.5" fill="#ffffff"/>
</svg>
